<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Snap X Story</title>

<link
rel="stylesheet"
href="../style.css">

</head>

<body>

<div id="storyViewer" class="story-viewer">

    <!-- Progress Bars -->

    <div id="storyProgress"
         class="story-progress">
    </div>

    <!-- Top Overlay -->

    <div class="story-top">

        <div class="story-user">

            <img
            id="storyAvatar"
            class="story-user-avatar"
            src="../assets/default-avatar.png"
            alt="Avatar">

            <div>

                <div id="storyUsername"
                     class="story-username">

                    Loading...

                </div>

                <div id="storyTime"
                     class="story-time">

                    Just now

                </div>

            </div>

        </div>

        <button id="closeStory"
                class="story-close">

            ✕

        </button>

    </div>

    <!-- Story Media -->

    <div class="story-media">

        <img
        id="storyImage"
        class="story-image"
        hidden>

        <video
        id="storyVideo"
        class="story-video"
        hidden
        playsinline
        autoplay>
        </video>

    </div>

    <!-- Navigation -->

    <div
    id="prevStory"
    class="story-side left">
    </div>

    <div
    id="nextStory"
    class="story-side right">
    </div>

</div>

<script
type="module"
src="../firebase/storyViewer.js">
</script>

</body>

</html>

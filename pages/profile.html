<!DOCTYPE html>

<html>

<head>

<title>Snap X Profile</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../style.css">

</head>

<body>

<header class="topbar">

<img
src="../assets/logo.svg"
class="logo-img"
alt="Snap X">

<a
href="feed.html"
class="profile-icon">

🏠

</a>

</header>

<div class="profile">
<img
id="photoPreview"
class="avatar"
src="../assets/default-avatar.png">

<div class="stats">


<div>
<b id="posts">
0</b>
<br>
Posts
</div>

<div>
<b id="followers">
0</b>
<br>
Followers
</div>

<div>
<b id="following">
0</b>
<br>
Following
</div>


<h2>
Your Snaps
</h2>



<div id="userPosts"
class="post-grid">


</div>


<input
id="displayName"
type="text"
placeholder="Display Name">

<textarea
id="bio"
placeholder="Tell people about yourself"></textarea>

<input
id="photoInput"
type="file"
accept="image/*">

<button
id="saveProfile"
class="follow-btn">

Save Profile

</button>

<button id="logoutBtn" class="follow-btn">
    Logout
</button>
</div>

<script type="module" src="../firebase/authGuard.js"></script>


<script type="module"
src="../firebase/profile.js">
</script>

<script type="module">

import { logout } from "../firebase/logout.js";

document
.getElementById("logoutBtn")
.onclick = async () => {

    const ok = confirm("Are you sure you want to logout?");

    if (!ok) return;

    await logout();

};

</script>


<script type="module">

import {
    loadProfile,
    saveProfile
} from "../firebase/profile.js";

import {
    uploadMedia
} from "../supabase/upload.js";

loadProfile();

document
.getElementById("saveProfile")
.onclick = async () => {

    const file =
        document
        .getElementById("photoInput")
        .files[0];

    let photoUrl = null;

    if(file){

        photoUrl =
            await uploadMedia(file);

    }

    await saveProfile(photoUrl);

};
document
.getElementById("photoInput")
.onchange = e => {

    const file = e.target.files[0];

    if(!file) return;

    document
    .getElementById("photoPreview")
    .src =
        URL.createObjectURL(file);

};

</script>

</body>

</html>

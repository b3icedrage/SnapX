<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Snap X Profile</title>

<link
rel="stylesheet"
href="../style.css">

</head>

<body>
<a href="verified.html">
✔ Get Verified
</a>
<nav class="bottom-nav">

<a href="feed.html" class="nav-item active">
    <img src="../assets/icons/home.svg" class="nav-icon">
    <span>Home</span>
</a>

<a href="search.html" class="nav-item">
    <img src="../assets/icons/search.svg" class="nav-icon">
    <span>Search</span>
</a>

<a href="snaps.html" class="nav-item nav-center">
    <div class="center-btn">
        <img src="../assets/icons/snaps.svg" class="nav-icon">
    </div>
</a>

<a href="notifications.html" class="nav-item">
    <img src="../assets/icons/activity.svg" class="nav-icon">
    <span>Activity</span>
</a>

<a href="profile.html" class="nav-item">
    <img src="../assets/icons/profile.svg" class="nav-icon">
    <span>Profile</span>
</a>

</nav>

<!-- ==========================
     AUTH GUARD
========================== -->

<script
type="module"
src="../firebase/authGuard.js">
</script>

<!-- ==========================
     TOP BAR
========================== -->

<header class="topbar">

<a href="feed.html">

<img
src="../assets/logo.svg"
class="logo-img"
alt="Snap X">

</a>

<h2>

Profile

</h2>

</header>

<!-- ==========================
     PROFILE
========================== -->

<main class="profile">

<!-- Avatar -->

<div class="profile-header">

<img
id="photoPreview"
class="avatar"
src="../assets/default-avatar.png">

<div class="profile-info">

<h2 id="profileName">

Loading...

</h2>

<p id="profileEmail">

Loading...

</p>

</div>

</div>

<!-- Stats -->

<div class="stats">

<div class="stat">

<h3 id="posts">

0

</h3>

<span>

Posts

</span>

</div>

<div class="stat">

<h3 id="followers">

0

</h3>

<span>

Followers

</span>

</div>

<div class="stat">

<h3 id="following">

0

</h3>

<span>

Following

</span>

</div>

</div>

<!-- Edit Profile -->

<div class="glass round shadow"
style="padding:20px;margin-bottom:25px;">

<h3
style="margin-bottom:18px;">

Edit Profile

</h3>

<input
id="displayName"
type="text"
placeholder="Display name"
style="
width:100%;
padding:15px;
margin-bottom:15px;
border-radius:14px;
background:#222;
color:white;
">

<textarea
id="bio"
placeholder="Tell people about yourself..."
style="
width:100%;
height:100px;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:14px;
background:#222;
color:white;
resize:none;
"></textarea>

<input
id="photoInput"
type="file"
accept="image/*">

<br><br>

<button
id="saveProfile"
class="follow-btn">

Save Profile

</button>

<br><br>

<button
id="logoutBtn"
class="follow-btn">

Logout

</button>

</div>

<!-- User Posts -->

<h2
style="margin-bottom:15px;">

Your Posts

</h2>

<div
id="userPosts"
class="post-grid">

<div class="loading">

Loading your posts...

</div>

</div>

</main>

<!-- ==========================
     SCRIPTS
========================== -->
<script
type="module"
src="../firebase/userPosts.js">
</script>

<script
type="module"
src="../firebase/profile.js">
</script>

<script type="module">

import { logout } from "../firebase/logout.js";

document
.getElementById("logoutBtn")
.onclick = async () => {

    if (!confirm("Logout from Snap X?"))
        return;

    await logout();

};

</script>

<script src="../script/navigation.js"></script>
</body>

</html>

<script type="module">

import {
createPost
}
from "../firebase/posts.js";


document
.getElementById("postBtn")
.onclick=()=>{

let text=
prompt("What's on your mind?");


if(text){

createPost(text);

}

};

</script>
<script type="module" src="../firebase/feed.js"></script>

<script type="module">

import {
uploadMedia
}
from "../supabase/upload.js";


document
.getElementById("postBtn")
.onclick=()=>{


let input=
document.createElement("input");


input.type="file";

input.accept=
"image/*,video/*";


input.onchange=
async()=>{


let file=input.files[0];


let url=
await uploadMedia(file);


console.log(
"Uploaded:",
url
);


alert(
"Media uploaded 🚀"
);


};


input.click();


};

</script>

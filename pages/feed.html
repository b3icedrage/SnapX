<!-- ==========================
     UPLOAD SYSTEM
=========================== -->

<script type="module">

import { uploadPost } from "../firebase/uploadPost.js";

const createBtn = document.getElementById("createBtn");

createBtn.addEventListener("click", () => {

    const picker = document.createElement("input");

    picker.type = "file";

    picker.accept = "image/*,video/*";

    picker.click();

    picker.onchange = async () => {

        const file = picker.files[0];

        if (!file) return;

        const caption =
            prompt("Write a caption (optional):") || "";

        createBtn.disabled = true;

        createBtn.innerHTML = "⏳";

        try {

            const success =
                await uploadPost(file, caption);

            if (success) {

                createBtn.innerHTML = "✓";

                setTimeout(() => {

                    createBtn.innerHTML = "+";

                }, 1000);

            }

        }

        catch (error) {

            console.error(error);

            alert("Upload failed.");

            createBtn.innerHTML = "+";

        }

        finally {

            createBtn.disabled = false;

        }

    };

});

</script>

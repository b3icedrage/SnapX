<!-- Upload System -->

<script type="module">

import { uploadMedia } from "../supabase/upload.js";


const btn =
document.getElementById("createBtn");


console.log("Snap X upload button:", btn);



btn.onclick = () => {


const input =
document.createElement("input");


input.type = "file";

input.accept = "image/*,video/*";



input.onchange = async () => {


const file =
input.files[0];


if(!file){

console.log("No file selected");

return;

}



console.log(
"Selected file:",
file.name
);



try {


const url =
await uploadMedia(file);



console.log(
"Upload result:",
url
);



if(url){

alert(
"Uploaded successfully 🚀"
);


location.reload();

}


}

catch(error){

console.error(
"Upload failed:",
error
);

alert(
"Upload error. Check console."
);

}


};



input.click();


};


</script>

<!-- Upload System -->

<script type="module">


import { uploadMedia } from "../supabase/upload.js";



const createBtn =
document.getElementById("createBtn");



console.log(
"Snap X create button:",
createBtn
);





createBtn.onclick = () => {



const input =
document.createElement("input");



input.type = "file";


input.accept =
"image/*,video/*";




input.onchange = async()=>{


const file =
input.files[0];



if(!file) return;




console.log(
"Selected:",
file.name
);




const url =
await uploadMedia(file);




if(url){


alert(
"Posted to Snap X 🚀"
);



}

};



input.click();



};



</script>

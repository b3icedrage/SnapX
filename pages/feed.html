<!-- Supabase Upload -->

<script type="module">


import {

uploadMedia

} from "../supabase/upload.js";





const uploadButton =
document.getElementById("postBtn");





console.log(
"Snap X upload ready",
uploadButton
);





uploadButton.onclick = () => {


const input =
document.createElement("input");



input.type = "file";


input.accept =
"image/*,video/*";





input.onchange = async () => {


const file =
input.files[0];



if(!file){

return;

}




console.log(
"Selected file:",
file.name
);




const url =
await uploadMedia(file);





if(url){


alert(
"Media uploaded 🚀"
);


console.log(
"Media URL:",
url
);


}



};




input.click();



};





</script>
